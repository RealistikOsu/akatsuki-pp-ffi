[package]
name = "akatsuki-pp-ffi"
version = "0.2.6"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
interoptopus = "0.14.14"
rosu-mods = { version = "0.4.1", features = ["serde"] }
serde = "1"
serde_json = "1"
akatsuki-pp-rs = { package = "akatsuki-pp", git = "https://github.com/RealistikOsu/akatsuki-pp-rs", rev = "b046dc8141daff053282901d9440f8fcdfeb5644" }

[dev-dependencies]
interoptopus_backend_csharp = "0.14.14"
interoptopus_backend_c = "0.14.13"
interoptopus_backend_cpython = "0.14.14"
